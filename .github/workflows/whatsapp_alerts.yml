name: WhatsApp Arrival Alerts

on:
  schedule:
    # يعمل كل ساعة
    - cron: '0 * * * *'
  workflow_dispatch:
    # يسمح بالتشغيل اليدوي من تبويب Actions

permissions:
  contents: read

jobs:
  check-arrivals:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run arrival check & send WhatsApp alerts
        env:
          WHATSAPP_RECIPIENTS: ${{ secrets.WHATSAPP_RECIPIENTS }}
        run: python scripts/check_arrivals.py
